<article class="panel category-panel">
  <h2>Gastos por categoría</h2>

  <div class="category-panel__body">
    <div class="donut" [style.background]="chartBackground" aria-label="Gráfico de gastos por categoría">
      <span>35%</span>
      <span>25%</span>
      <span>20%</span>
      <span>10%</span>
      <span>10%</span>
    </div>

    <ul class="legend">
      <li *ngFor="let category of categories">
        <span class="legend__dot" [style.background]="category.color" aria-hidden="true"></span>
        <span>{{ category.label }}</span>
        <strong>{{ category.amount }}</strong>
      </li>
    </ul>
  </div>

  <button type="button">Ver todas las categorías</button>
</article>
