<section class="movements-panel">
  <div class="movements-panel__header">
    <h2>Últimos movimientos</h2>
    <button type="button">Ver todos</button>
  </div>

  <ul class="movements-list">
    <li *ngFor="let movement of movements">
      <span class="movement-icon" [class.movement-icon--income]="movement.type === 'income'" aria-hidden="true">
        <ion-icon [name]="movement.type === 'income' ? 'download-outline' : 'arrow-up-outline'"></ion-icon>
      </span>

      <div class="movement-copy">
        <strong>{{ movement.title }}</strong>
        <span>{{ movement.category }}</span>
      </div>

      <time>{{ movement.date }}</time>

      <strong class="movement-amount" [class.movement-amount--income]="movement.type === 'income'">
        {{ movement.amount }}
      </strong>
    </li>
  </ul>
</section>
