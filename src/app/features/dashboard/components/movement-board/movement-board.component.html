<article class="movements-board">
  <header class="mobile-toolbar">
    <button class="icon-button" type="button" aria-label="Abrir menu">
      <ion-icon name="menu-outline" aria-hidden="true"></ion-icon>
    </button>
    <strong>Movimientos</strong>
    <div class="mobile-toolbar__actions">
      <button class="icon-button" type="button" aria-label="Buscar movimientos">
        <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
      </button>
      <button class="icon-button" type="button" aria-label="Eliminar movimientos">
        <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
      </button>
    </div>
  </header>

  <div class="movement-tabs" role="tablist" aria-label="Filtro de movimientos">
    <button
      *ngFor="let filter of filters"
      class="movement-tab"
      [class.movement-tab--active]="filter.id === selectedFilter"
      type="button"
      role="tab"
      [attr.aria-selected]="filter.id === selectedFilter"
      (click)="filterChange.emit(filter.id)"
    >
      {{ filter.label }}
    </button>
  </div>

  <div *ngIf="loading" class="movement-state">
    <ion-icon name="sync-outline" aria-hidden="true"></ion-icon>
    <strong>Cargando movimientos...</strong>
  </div>

  <div *ngIf="!loading && errorMessage" class="movement-state movement-state--error">
    <ion-icon name="warning-outline" aria-hidden="true"></ion-icon>
    <strong>{{ errorMessage }}</strong>
    <button type="button" (click)="retry.emit()">Reintentar</button>
  </div>

  <div *ngIf="!loading && !errorMessage && groups.length === 0" class="movement-state">
    <ion-icon name="file-tray-outline" aria-hidden="true"></ion-icon>
    <strong>No hay movimientos para mostrar.</strong>
  </div>

  <div *ngIf="!loading && !errorMessage && groups.length > 0" class="movement-groups">
    <section *ngFor="let group of groups; trackBy: trackByLabel" class="movement-group" [attr.aria-label]="group.label">
      <h2>{{ group.label }}</h2>

      <ul>
        <li *ngFor="let movement of group.items; trackBy: trackByMovement" class="movement-row">
          <span
            class="movement-row__icon"
            [class.movement-row__icon--income]="movement.kind === 'income'"
            [class.movement-row__icon--expense]="movement.kind === 'expense'"
            [class.movement-row__icon--transfer]="movement.kind === 'transfer'"
          >
            <ion-icon
              [name]="movement.kind === 'income' ? 'download-outline' : movement.kind === 'expense' ? 'arrow-up-outline' : 'swap-horizontal-outline'"
              aria-hidden="true"
            ></ion-icon>
          </span>

          <span class="movement-row__copy">
            <strong>{{ movement.title }}</strong>
            <small>{{ movement.description }}</small>
          </span>

          <span class="movement-row__meta">
            <strong
              class="movement-row__amount"
              [class.movement-row__amount--income]="movement.kind === 'income'"
              [class.movement-row__amount--expense]="movement.kind === 'expense'"
              [class.movement-row__amount--transfer]="movement.kind === 'transfer'"
            >
              {{ movement.amount }}
            </strong>
            <time>{{ movement.time }}</time>
          </span>
        </li>
      </ul>
    </section>
  </div>

  <button class="floating-action" type="button" aria-label="Agregar movimiento" (click)="addMovement.emit()">
    <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
  </button>

  <nav class="bottom-navigation" aria-label="Navegacion inferior">
    <button
      *ngFor="let item of bottomNavigation"
      class="bottom-navigation__item"
      [class.bottom-navigation__item--active]="item.active"
      [routerLink]="item.route || null"
      type="button"
    >
      <ion-icon [name]="item.icon" aria-hidden="true"></ion-icon>
      <span>{{ item.label }}</span>
    </button>
  </nav>
</article>
