<section
  *ngIf="!dismissed"
  class="finance-alert"
  [class.finance-alert--danger]="tone === 'danger'"
  [class.finance-alert--neutral]="tone === 'neutral'"
  aria-label="Estado financiero"
>
  <span class="finance-alert__icon" aria-hidden="true">
    <ion-icon [name]="iconName"></ion-icon>
  </span>

  <div>
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <strong>{{ detail }}</strong>
  </div>

  <button type="button" aria-label="Cerrar alerta" (click)="dismiss()">
    <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
  </button>
</section>
